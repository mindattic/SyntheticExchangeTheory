<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="2.82in" viewBox="0 0 600 282" role="img" aria-labelledby="t d">
<title id="t">The survival share is a percentage with a binding physical minimum</title>
<desc id="d">The survival share sigma, plotted against the per-person allocation a, equals the floor bundle's value divided by a when that exceeds the ordinary share sigma-zero, is capped at one, and equals sigma-zero otherwise. Three regions: where the whole allocation falls short of the floor the share is one and the floor cannot be met without raising theta; where the allocation is modest the share rises to cover the floor; where the allocation is ample the ordinary share applies.</desc>
