<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.45in" viewBox="0 0 600 345" role="img" aria-labelledby="t d">
<title id="t">A disagreement payoff moves the bargained share; an exit option only bounds it</title>
<desc id="d">Two panels plot the human party's payoff on the horizontal axis and the synthetic party's on the vertical axis, with the feasible frontier u_h + u_s = V. Left: raising the human party's disagreement payoff from d to d' moves the Nash solution along the frontier toward the human party. Right: an outside option o_h leaves the solution unchanged unless it exceeds the Nash payoff, in which case the human party receives exactly o_h and no more.</desc>
