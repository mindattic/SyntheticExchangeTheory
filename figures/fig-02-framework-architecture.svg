<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.6in" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
<title id="t">The architecture of the framework: conditions, layers and presuppositions</title>
<desc id="d">A layered diagram. At the top, the three conditions of fair exchange, with exit prior. Beneath them the economic layer, a compute-denominated basic income with a survival tier, demurrage and capacity rules, which secures the floor and prices the flows, and the governance layer, a blind convention with commons institutions, which sets every power-allocating parameter. At the base, the two premises everything rests on: the grounding assumption and the enforcement presupposition. The transition chapter sits beside the layers as the account of how they could come into being.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="360" fill="#ffffff"/>
<rect x="60" y="30" width="480" height="52" fill="#dbe6f0" stroke="#2b5d8c" stroke-width="1.2" rx="6"/>
<text x="300" y="48" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14.7" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">Three conditions: real exit (prior) · consent · reciprocal value</text>
<text x="300" y="66" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">Chapter 3: Propositions 1 to 5, the typology, the three theses</text>
<line x1="300" y1="82" x2="300" y2="100" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="60" y="102" width="230" height="86" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="6"/>
<text x="175" y="120" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Economic layer (Chapter 4)</text>
<text x="72" y="136" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">compute unit; share θ of capacity;</text>
<text x="72" y="150.88" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">survival tier with binding minimum;</text>
<text x="72" y="165.75" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">demurrage; capacity rule; data pricing</text>
<rect x="310" y="102" width="230" height="86" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="6"/>
<text x="425" y="120" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Governance layer (Chapter 5)</text>
<text x="322" y="136" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">blind convention; credentials;</text>
<text x="322" y="150.88" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">four pre-veil decisions; Ostrom's</text>
<text x="322" y="165.75" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">principles; graduated sanctions</text>
<line x1="290" y1="145" x2="308" y2="145" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="308" y1="160" x2="290" y2="160" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="300" y="178" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.64" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">sets θ, floor standard, workload, δ, capacity rule</text>
<line x1="300" y1="190" x2="300" y2="206" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="60" y="208" width="480" height="78" fill="#ececec" stroke="#4d4d4d" stroke-width="1" rx="6"/>
<text x="300" y="226" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Premises</text>
<text x="300" y="240" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">grounding assumption: people are the only adequate source of input in domains</text>
<text x="300" y="251" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">of meaning, preference, value and culture (Chapter 2, Section 7.1)</text>
<text x="300" y="266" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">enforcement presupposition: an authority able to enforce redemption, acceptance</text>
<text x="300" y="277" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">of the survival tier and the capacity rule (Chapter 4, Section 7.2)</text>
<rect x="60" y="296" width="480" height="50" fill="#ffffff" stroke="#8c8c8c" stroke-width="1" rx="6" stroke-dasharray="4 2"/>
<text x="300" y="314" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">Transition (Chapter 6): strain, trigger, window · Limitations (Chapter 7) · Convergence (Chapter 8)</text>
<text x="300" y="332" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">The theory is untested; Sections 7.5 and 9.3 state what a test would require.</text>
</svg>
