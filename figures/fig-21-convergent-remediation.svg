<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.08in" viewBox="0 0 600 308" role="img" aria-labelledby="t d">
<title id="t">Convergent remediation: many organizations, few models, one shared exposure</title>
<desc id="d">Left: before, many organizations fix the same class of flaw independently, so their fixes differ and a defect in one fix exposes one organization. Right: after, the same few models propose and check the fixes for all of them, so the fixes converge, a shared defect in the fix is reproduced across all, and what would have been partly correlated failures become one exposure. The number of dependent systems is unchanged; only the diversity of their fixes falls.</desc>
