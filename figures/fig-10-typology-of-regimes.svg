<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.18in" viewBox="0 0 600 318" role="img" aria-labelledby="t d">
<title id="t">Five prototypes of exchange regime by clause pattern</title>
<desc id="d">A matrix with the nine clauses as columns and the five prototypes as rows, from partnership, where every clause holds, through patronage, the marketplace of the desperate and the company town, to enclosure, where every clause fails. Filled cells mark clauses that hold, open cells clauses that fail, and half-filled cells clauses that fail conditionally. The present data economy is marked between the marketplace of the desperate and the company town.</desc>
