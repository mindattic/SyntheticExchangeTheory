<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.56in" viewBox="0 0 600 356" role="img" aria-labelledby="t d">
<title id="t">Capacity, unit and claim: how the compute dividend is issued, redeemed and retired</title>
<desc id="d">A flow diagram. Measured capacity C(t) in reference-workload units is the base; a share theta of it is credited equally to N persons as claims on a settlement ledger; claims are redeemed at par for the reference workload with owners of capacity up to the obligated share, with a rationing rule beyond it; demurrage retires idle claims, and the next period's dividend is computed from capacity, not from the stock of claims.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="356" fill="#ffffff"/>
<rect x="20" y="60" width="150" height="70" fill="#ececec" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="95" y="78.38" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Capacity C(t)</text>
<text x="95" y="95" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">physical, perishable;</text>
<text x="95" y="111.62" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">measured in units</text>
<rect x="225" y="60" width="150" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="300" y="78.38" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Issuance</text>
<text x="300" y="95" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">θ · C(t) / N(t)</text>
<text x="300" y="111.62" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">to each person</text>
<rect x="430" y="60" width="150" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="505" y="78.38" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Claims</text>
<text x="505" y="95" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">ledger balances</text>
<text x="505" y="111.62" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">denominated in units</text>
<line x1="170" y1="95" x2="223" y2="95" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="197" y="88" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#1a1a1a" dominant-baseline="auto">share θ</text>
<line x1="375" y1="95" x2="428" y2="95" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="402" y="88" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#1a1a1a" dominant-baseline="auto">credit</text>
<rect x="430" y="190" width="150" height="70" fill="#dbe6f0" stroke="#2b5d8c" stroke-width="1" rx="3"/>
<text x="505" y="201.38" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Redemption</text>
<text x="505" y="217.12" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">at par for the reference</text>
<text x="505" y="232.88" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">workload, up to the</text>
<text x="505" y="248.62" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">obligated share</text>
<line x1="505" y1="130" x2="505" y2="188" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="512" y="160" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="italic" fill="#1a1a1a" dominant-baseline="auto">spend</text>
<rect x="225" y="190" width="150" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="300" y="209.25" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Owners of capacity</text>
<text x="300" y="225" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">deliver workload</text>
<text x="300" y="240.75" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">(redemption obligation)</text>
<line x1="428" y1="225" x2="377" y2="225" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="430" y="280" width="150" height="36" fill="#ffffff" stroke="#8c8c8c" stroke-width="1" rx="3"/>
<text x="505" y="290.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">beyond the share: queue,</text>
<text x="505" y="305.44" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">lot, or price above par</text>
<line x1="505" y1="260" x2="505" y2="278" stroke="#8c8c8c" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#arrow-mid)"/>
<rect x="225" y="280" width="150" height="36" fill="#ffffff" stroke="#8c8c8c" stroke-width="1" rx="3"/>
<text x="300" y="290.12" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Demurrage retires</text>
<text x="300" y="305.88" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">idle claims</text>
<path d="M 450 125 Q 300 150 300 278" fill="none" stroke="#8c8c8c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 2" marker-end="url(#arrow-mid)"/>
<text x="330" y="165" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">idle balance</text>
<path d="M 95 130 Q 95 300 215 300" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 3"/>
<text x="60" y="220" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">next period's</text>
<text x="60" y="232" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">dividend is computed</text>
<text x="60" y="244" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">from capacity, not</text>
<text x="60" y="256" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">from claims</text>
<text x="20" y="40" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">Three things the word compute names are kept apart: capacity, unit, claim.</text>
<text x="300" y="330" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">The share θ must not exceed the obligated share of capacity, or claims exceed redeemable capacity</text>
<text x="300" y="344.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">every period (Section 4.4).</text>
</svg>
