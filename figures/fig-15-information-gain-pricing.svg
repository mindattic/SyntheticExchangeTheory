<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="2.72in" viewBox="0 0 600 272" role="img" aria-labelledby="t d">
<title id="t">Under information-gain pricing the price of each further similar datum falls</title>
<desc id="d">For a model estimating a parameter with prior variance one and observation noise variance one, the information the n-th similar datum adds is one half of the log of one plus one over n, which falls toward zero, while a novel datum, one that bears on a parameter the model has not seen, adds the full first-observation gain. The price therefore follows novelty to the model, not status among people.</desc>
