<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.45in" viewBox="0 0 600 345" role="img" aria-labelledby="t d">
<title id="t">The scope of the theory's claims</title>
<desc id="d">Nested regions of synthetic parties. Outermost: any party, for which the theory claims only that the floor clause of exit is necessary for a party that cannot leave. Inside: parties with designed and stable objectives. Innermost: parties that also have an accountable principal, the designed-incentive regime, in which fair terms, once enforced, are conjectured sufficient. Emergent, unstable or concealed objectives, and systems beyond the reach of enforcement, lie outside; tissue-based parties in their own right are not yet reached by the definitions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="345" fill="#ffffff"/>
<rect x="30" y="40" width="540" height="230" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="8"/>
<text x="42" y="58" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Any synthetic party</text>
<text x="42" y="72" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">claim: E(i) is necessary, for a party that cannot leave, to non-domination (Insufficiency thesis)</text>
<rect x="60" y="86" width="480" height="170" fill="#ececec" stroke="#4d4d4d" stroke-width="1" rx="8"/>
<text x="72" y="104" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Designed and stable objective</text>
<text x="72" y="118" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">the regime criterion: provenance and stability of the objective, not capability</text>
<rect x="90" y="132" width="420" height="122" fill="#dbe6f0" stroke="#2b5d8c" stroke-width="1.2" rx="8"/>
<text x="102" y="150" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">Designed-incentive regime</text>
<text x="102" y="164" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">a designed, stable objective held by an accountable principal</text>
<text x="102" y="182" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">claim: fair terms, satisfied at every level the data concerns, are sufficient</text>
<text x="102" y="196" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">once enforced (Sufficiency conjecture); open premise: the terms can be made to bind</text>
<text x="102" y="218" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">a superintelligence with such an objective and principal falls here;</text>
<text x="102" y="232" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">a narrow system with an emergent objective does not (Section 1.2)</text>
<text x="42" y="290" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="start" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="auto">Outside the regime: emergent, unstable or concealed objectives (Scope thesis); parties beyond the</text>
<text x="42" y="304.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="start" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="auto">reach of enforcement with dependence near zero (Section 7.6); tissue-based parties in their own</text>
<text x="42" y="319.12" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="start" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="auto">right, which the definitions do not yet reach (Section 8.5). For these the framework claims only the</text>
<text x="42" y="333.68" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="start" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="auto">necessary condition.</text>
</svg>
