<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.12in" viewBox="0 0 600 312" role="img" aria-labelledby="t d">
<title id="t">Three channels of accumulation and the instrument that acts on each</title>
<desc id="d">Discretionary income can be held as idle balances, lent as loan claims, or converted into compute-generating capacity. Demurrage bounds the first and lowers the lender's net return on the second without closing it; only a rule on capacity acts on the third, and that rule is left to the convention. Demurrage therefore has no distributive effect of its own without the capacity rule.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="312" fill="#ffffff"/>
<rect x="20" y="110" width="120" height="60" fill="#ececec" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="80" y="131.25" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Discretionary</text>
<text x="80" y="148.75" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">income</text>
<line x1="140" y1="140" x2="208" y2="70" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="210" y="40" width="170" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="295" y="62.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Idle balances</text>
<text x="295" y="77.44" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">ρ = −δ: bounded at k/δ</text>
<line x1="380" y1="70" x2="408" y2="70" stroke="#2b5d8c" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow-accent)"/>
<rect x="410" y="46" width="172" height="48" fill="#ffffff" stroke="#2b5d8c" stroke-width="1" rx="3"/>
<text x="496" y="63" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="middle">Demurrage</text>
<text x="496" y="77" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="middle">bounds the balance</text>
<line x1="140" y1="140" x2="208" y2="150" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="210" y="120" width="170" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="295" y="142.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Loan claims</text>
<text x="295" y="157.44" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">net return r − δ; open if r ≥ δ</text>
<line x1="380" y1="150" x2="408" y2="150" stroke="#8c8c8c" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow-mid)"/>
<rect x="410" y="126" width="172" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="1" rx="3"/>
<text x="496" y="143" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#8c8c8c" dominant-baseline="middle">Demurrage on claims</text>
<text x="496" y="157" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#8c8c8c" dominant-baseline="middle">lowers; does not close</text>
<line x1="140" y1="140" x2="208" y2="230" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<rect x="210" y="200" width="170" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="295" y="222.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">Capacity: hardware, equity,</text>
<text x="295" y="237.44" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">land; compounds at π</text>
<line x1="380" y1="230" x2="408" y2="230" stroke="#a0522d" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow-warn)"/>
<rect x="410" y="206" width="172" height="48" fill="#ffffff" stroke="#a0522d" stroke-width="1" rx="3"/>
<text x="496" y="216" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="middle">Capacity rule</text>
<text x="496" y="230" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="middle">the only instrument; left to</text>
<text x="496" y="244" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="middle">the convention</text>
<text x="300" y="282" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">Without the capacity rule, holders convert balances into capacity and the demurrage bound</text>
<text x="300" y="297.47" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">binds on nothing (Section 4.6).</text>
</svg>
