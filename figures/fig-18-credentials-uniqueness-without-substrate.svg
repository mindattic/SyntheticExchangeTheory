<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.68in" viewBox="0 0 600 368" role="img" aria-labelledby="t d">
<title id="t">Credentials attest uniqueness without disclosing substrate: the issuer partition and its two gaps</title>
<desc id="d">Three issuers each certify a disjoint population; each principal receives one credential that attests it is one bearer of obligations without saying whether it is a person or a system; the credentials enter a blinded pool that seats one participant per credential. Two gaps are marked: a principal certified by several issuers could hold several credentials unless the partition is kept disjoint, and an operator controlling several legal persons could hold several seats.</desc>
