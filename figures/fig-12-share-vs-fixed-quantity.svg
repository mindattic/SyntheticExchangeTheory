<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.3in" viewBox="0 0 600 330" role="img" aria-labelledby="t d">
<title id="t">A fixed quantity of compute loses real value as compute grows abundant; a share tracks the real purchasing power of all compute</title>
<desc id="d">Real value of the allocation over time under illustrative growth: capacity C doubles every two years and the goods price of compute p falls by 30 percent a year while population is flat. A fixed quantity's real value falls with 1 over p; a fixed share's real value tracks C over p, which rises while capacity grows faster than its relative price falls.</desc>
