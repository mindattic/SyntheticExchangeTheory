<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.22in" viewBox="0 0 600 322" role="img" aria-labelledby="t d">
<title id="t">The three conditions, their nine clauses, and the clause-level dependencies</title>
<desc id="d">Three columns list the clauses of real exit, consent and reciprocal value. Arrows show the four dependencies the chapter establishes: a failure of E(i) entails a failure of C(ii) and, where the sub-floor position determines the division, of R(iii); a failure of E(iii) entails a failure of C(iii) where destroyed assets exceed value received; and a complete failure of C(i) entails a failure of R(ii). Exit is prior; consent and reciprocity are not ordered with respect to each other.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="322" fill="#ffffff"/>
<rect x="12" y="40" width="180" height="244" fill="#ececec" stroke="#cfcfcf" stroke-width="1" rx="4"/>
<text x="102" y="60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Condition E: Real exit</text>
<rect x="20" y="80" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="26" y="94" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">E(i)</text>
<text x="26" y="107" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">disagreement payoff at or</text>
<text x="26" y="118" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">above the floor</text>
<rect x="20" y="140" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="26" y="154" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">E(ii)</text>
<text x="26" y="167" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">an exit option not</text>
<text x="26" y="178" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">drastically worse</text>
<rect x="20" y="200" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="26" y="214" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">E(iii)</text>
<text x="26" y="227" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">leaving destroys no</text>
<text x="26" y="238" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">accumulated assets</text>
<rect x="210" y="40" width="180" height="244" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="4"/>
<text x="300" y="60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Condition C: Consent</text>
<rect x="218" y="80" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="224" y="94" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">C(i)</text>
<text x="224" y="107" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">accurate account of the</text>
<text x="224" y="118" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">flows and their shadows</text>
<rect x="218" y="140" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="224" y="154" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">C(ii)</text>
<text x="224" y="167" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">can refuse, entering no</text>
<text x="224" y="178" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">other, above the floor</text>
<rect x="218" y="200" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="224" y="214" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">C(iii)</text>
<text x="224" y="227" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">can revoke at a bounded cost</text>
<rect x="408" y="40" width="180" height="244" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="4"/>
<text x="498" y="60" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Condition R: Reciprocal value</text>
<rect x="416" y="80" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="422" y="94" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">R(i)</text>
<text x="422" y="107" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">each party's net gain is</text>
<text x="422" y="118" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">positive</text>
<rect x="416" y="140" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="422" y="154" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">R(ii)</text>
<text x="422" y="167" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">gains are legible to both</text>
<rect x="416" y="200" width="164" height="48" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.8" rx="3"/>
<text x="422" y="214" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.6" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">R(iii)</text>
<text x="422" y="227" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">division not set solely by</text>
<text x="422" y="238" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">an unchosen asymmetry</text>
<path d="M 184 104 Q 201 118 218 164" fill="none" stroke="#2b5d8c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
<text x="201" y="74" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">Prop. 1</text>
<path d="M 184 224 Q 201 242 218 224" fill="none" stroke="#2b5d8c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 2" marker-end="url(#arrow-accent)"/>
<text x="201" y="264" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">if assets lost exceed value</text>
<path d="M 382 104 Q 399 118 416 164" fill="none" stroke="#2b5d8c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 2" marker-end="url(#arrow-accent)"/>
<text x="399" y="74" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">if complete</text>
<path d="M 52 128 L 52 296 L 448 296 L 448 250" fill="none" stroke="#2b5d8c" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 2" marker-end="url(#arrow-accent)"/>
<text x="300" y="310" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">E(i) fails and the sub-floor position alone sets the division: R(iii) fails (Prop. 3)</text>
</svg>
