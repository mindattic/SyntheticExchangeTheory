<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.16in" viewBox="0 0 600 316" role="img" aria-labelledby="t d">
<title id="t">Impatience below the floor drives the human party's share of the surplus toward zero</title>
<desc id="d">The human party's bargaining weight alpha equals r_s divided by r_h plus r_s, plotted against the human party's discount rate r_h for a fixed r_s. As r_h grows without bound, which the survival constraint implies for a party below its floor, alpha falls toward zero and the party receives only its disagreement payoff. A floor keeps r_h finite and so keeps alpha positive.</desc>
