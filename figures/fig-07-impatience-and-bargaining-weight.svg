<text x="300" y="296.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">1986); the survival constraint that sends the human party's discount rate to infinity is a stated</text>
<text x="300" y="311.12" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">assumption (Appendix A.3.2).</text>
