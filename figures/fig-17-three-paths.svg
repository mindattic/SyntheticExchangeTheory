<rect x="510" y="100" width="70" height="36" fill="#dbe6f0" stroke="#2b5d8c" stroke-width="1" rx="3"/>
<text x="545" y="118" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">systems</text>
<line x1="480" y1="112" x2="508" y2="112" stroke="#2b5d8c" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow-accent)"/>
<line x1="508" y1="124" x2="480" y2="124" stroke="#2b5d8c" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow-accent)"/>
<text x="490" y="92" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">terms: consent, value, exit</text>
<rect x="420" y="150" width="140" height="40" fill="#ffffff" stroke="#2b5d8c" stroke-width="1" rx="4" stroke-dasharray="4 2"/>
<text x="490" y="166" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">floor no one can bargain away;</text>
<text x="490" y="178" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">rules written behind a veil</text>
<text x="490" y="206" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">does not need goodwill in order</text>
<text x="490" y="218" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">to persist (the body's claim)</text>
<path d="M 60 236 Q 60 230 66 230 L 191.5 230 Q 197.5 230 197.5 224 Q 197.5 230 203.5 230 L 329 230 Q 335 230 335 236" fill="none" stroke="#4d4d4d" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="197" y="258" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">the same relation with the roles exchanged (a</text>
<text x="197" y="273.47" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">stipulation of Section 3.8)</text>
