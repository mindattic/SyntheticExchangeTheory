<text x="100" y="44" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">people control systems</text>
<rect x="50" y="60" width="100" height="36" fill="#ececec" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="100" y="78" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">people</text>
<rect x="50" y="150" width="100" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="3"/>
<text x="100" y="168" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="middle">systems</text>
<line x1="100" y1="96" x2="100" y2="148" stroke="#a0522d" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#arrow-warn)"/>
<text x="108" y="118" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="auto">rules</text>
<text x="108" y="130" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#a0522d" dominant-baseline="auto">depends</text>
<text x="100" y="206" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">stable only while the ruler</text>
<text x="100" y="218" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">stays benevolent and strong</text>
<text x="295" y="30" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Path 2:</text>
<text x="295" y="44" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">systems control people</text>
