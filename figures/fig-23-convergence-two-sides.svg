<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.16in" viewBox="0 0 600 316" role="img" aria-labelledby="t d">
<title id="t">Convergence from two sides</title>
<desc id="d">Two axes meet. Along the horizontal axis people incorporate machines: records, implants, speech neuroprostheses with personal voice models. Along the vertical axis machines become biological: neuromorphic hardware, organoid reservoirs, sentience candidates. Cases from Chapter 8 are placed on each axis, and the corner where they meet is marked as the point at which the theory's question changes from how parties should exchange to who counts as a party.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="316" fill="#ffffff"/>
<line x1="90" y1="240" x2="560" y2="240" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<line x1="90" y1="240" x2="90" y2="50" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="560" y="258" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="end" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">people incorporating machines (8.1)</text>
<text x="76" y="50" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="end" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto" transform="rotate(-90 76 50)">machines becoming biological (8.2)</text>
<circle cx="160" cy="240" r="4.5" fill="#1a1a1a" stroke="none" stroke-width="1"/>
<text x="160" y="230" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">medical records</text>
<circle cx="290" cy="240" r="4.5" fill="#1a1a1a" stroke="none" stroke-width="1"/>
<text x="290" y="218" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">implanted device</text>
<circle cx="430" cy="240" r="4.5" fill="#1a1a1a" stroke="none" stroke-width="1"/>
<text x="430" y="230" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">speech neuroprosthesis</text>
<text x="290" y="230" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto"></text>
<text x="430" y="218" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">with a personal voice model</text>
<text x="430" y="206" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">(Card et al., 2024)</text>
<circle cx="90" cy="190" r="4.5" fill="#1a1a1a" stroke="none" stroke-width="1"/>
<text x="100" y="193" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">neuromorphic hardware</text>
<circle cx="90" cy="130" r="4.5" fill="#1a1a1a" stroke="none" stroke-width="1"/>
<text x="100" y="133" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">organoid reservoir</text>
<circle cx="90" cy="80" r="4.5" fill="#1a1a1a" stroke="none" stroke-width="1"/>
<text x="100" y="83" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">sentience candidate</text>
<path d="M 430 200 Q 440 120 110 80" fill="none" stroke="#2b5d8c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
<circle cx="480" cy="110" r="36" fill="#dbe6f0" stroke="#2b5d8c" stroke-width="1.2"/>
<text x="480" y="104" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.32" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">who counts</text>
<text x="480" y="116" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.32" text-anchor="middle" font-weight="bold" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">as a party?</text>
<text x="330" y="90" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.48" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">conditions stay substrate-neutral;</text>
<text x="330" y="102" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.48" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">their content and sufficiency change (8.5)</text>
<text x="300" y="282" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">Exit from an implanted system must include ownership and portability of the personal models</text>
<text x="300" y="297.47" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">the exchange produces (Section 8.3).</text>
</svg>
