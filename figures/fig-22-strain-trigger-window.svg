<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.16in" viewBox="0 0 600 316" role="img" aria-labelledby="t d">
<title id="t">Slow strain, a discrete trigger, and a window that opens onto two branches</title>
<desc id="d">A timeline. Three slow pressures, labor displacement, energy and physical resources, and strategic competition, accumulate beneath a threshold; a discrete trigger, the correlated-patch catastrophe, opens a policy window; the window closes onto either a fair founding, available only if the design was prepared in advance, or an authoritarian consolidation of control over compute.</desc>
