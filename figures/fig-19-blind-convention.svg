<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="3.6in" viewBox="0 0 600 360" role="img" aria-labelledby="t d">
<title id="t">The blind convention: what is decided before the veil and what lies behind it</title>
<desc id="d">Nested regions. Outermost: the genesis rules and four pre-veil decisions, the eligibility criterion, the aggregation rule, the partition of credential issuers and the monitor's accountability, which are visible and revisable. Inside: weak blindness, under which participants do not know their counterparties' kind, and strong blindness, under which they also do not know how the rules will classify them. At the center the convention chooses general formulas for the share, the floor standard, the workload, the demurrage rate and the capacity rules.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d8c"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0522d"/></marker><marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1a1a1a"/></marker><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8c8c8c" stroke-width="1"/></pattern><pattern id="hatch-accent" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b5d8c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="600" height="360" fill="#ffffff"/>
<rect x="20" y="30" width="560" height="290" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="6"/>
<text x="32" y="48" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Decided before the veil (visible, revisable):</text>
<text x="32" y="66" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.32" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">1  eligibility: one seat per unique accountable principal</text>
<text x="32" y="80" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.32" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">2  aggregation rule (open)</text>
<text x="32" y="94" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.32" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">3  partition of the population among credential issuers</text>
<text x="32" y="108" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12.32" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">4  accountability of the monitor of the convention's blindness</text>
<rect x="40" y="130" width="520" height="178" fill="#ececec" stroke="#4d4d4d" stroke-width="1" rx="6"/>
<text x="52" y="148" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">Weak blindness: counterparties' kind concealed</text>
<text x="52" y="162" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">prevents coalitions and vote trading by substrate; each participant still knows its own kind</text>
<rect x="60" y="172" width="480" height="124" fill="#dbe6f0" stroke="#2b5d8c" stroke-width="1" rx="6"/>
<text x="72" y="190" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">Strong blindness: how the rules will classify oneself concealed</text>
<text x="72" y="204" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="start" font-weight="normal" font-style="normal" fill="#2b5d8c" dominant-baseline="auto">force in proportion to the share of borderline participants; none for present principals</text>
<rect x="90" y="216" width="420" height="68" fill="#ffffff" stroke="#2b5d8c" stroke-width="1.2" rx="4"/>
<text x="300" y="234" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13.3" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a" dominant-baseline="auto">The convention chooses general formulas, not figures:</text>
<text x="300" y="250" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4d4d" dominant-baseline="auto">share θ · floor standard · workload · demurrage δ · capacity rule · data governance</text>
<text x="300" y="266" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.9" text-anchor="middle" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">aim: Rawlsian impartiality by public-choice means (Brennan &amp; Buchanan, 1985)</text>
<text x="20" y="332" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">Enforcement and the symbiosis standard sit outside the diagram: the first is presupposed (Chapter 4,</text>
<text x="20" y="346.56" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="11.2" text-anchor="start" font-weight="normal" font-style="italic" fill="#4d4d4d" dominant-baseline="auto">Section 5.10), the second is a requirement the institutions must grow into (Section 5.7).</text>
</svg>
